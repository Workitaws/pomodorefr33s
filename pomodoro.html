<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍅 Pomodoro Timer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --work-color: #f44336;
            --break-color: #4CAF50;
            --dark-bg: #1a1a2e;
            --dark-card: #16213e;
            --light-bg: #f5f7fa;
            --light-card: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            transition: all 0.3s ease;
            padding: 20px;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
        }

        .container {
            background: var(--light-card);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            width: 100%;
            max-width: 450px;
            transition: all 0.3s ease;
        }

        .dark-mode .container {
            background: var(--dark-card);
            color: #ffffff;
        }

        h1 {
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .dark-mode h1 {
            color: #ffffff;
        }

        .timer-display {
            font-size: 3.0rem;
            font-weight: bold;
            margin: -8.5rem 0;
            color: #333;
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            transition: color 0.3s;
        }

        .dark-mode .timer-display {
            color: #ffffff;
        }

        .mode-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
            background: #f0f0f0;
            border-radius: 50px;
            padding: 5px;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }

        .dark-mode .mode-indicator {
            background: #2d3748;
        }

        .mode-btn {
            padding: 10px 25px;
            margin: 0;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: transparent;
            color: #666;
            font-weight: 600;
            flex: 1;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: var(--work-color);
            color: white;
            box-shadow: 0 4px 8px rgba(244, 67, 54, 0.3);
        }

        .mode-btn.active.break-mode {
            background: var(--break-color);
            box-shadow: 0 4px 8px rgba(76, 175, 80, 0.3);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 2rem 0;
        }

        .btn {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            min-width: 110px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            box-shadow: 0 4px 12px rgba(108, 117, 125, 0.4);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(108, 117, 125, 0.5);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(220, 53, 69, 0.5);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .settings {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 15px;
            margin: 1.5rem 0;
            text-align: left;
        }

        .dark-mode .settings {
            background: #2d3748;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-row label {
            font-weight: 500;
            color: #555;
        }

        .dark-mode .setting-row label {
            color: #ccc;
        }

        .number-input {
            width: 80px;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            background: white;
        }

        .dark-mode .number-input {
            background: #4a5568;
            border-color: #718096;
            color: white;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background: #e9ecef;
            padding: 1.2rem;
            border-radius: 15px;
            margin-top: 1.5rem;
            font-weight: 600;
        }

        .dark-mode .stats {
            background: #2d3748;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .dark-mode .stat-value {
            color: #a3bffa;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .dark-mode .stat-label {
            color: #ccc;
        }

        .tomato-icon {
            color: var(--work-color);
            font-size: 1.8rem;
            margin-bottom: -5px;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(30deg);
        }

        .progress-ring {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }

        .progress-ring-circle {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 1s linear;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            
            .timer-display {
                font-size: 4rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 200px;
            }
            
            .setting-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

            .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
            }

            .dark-mode .stat-label {
            color: #222222;
            }

            .theme-toggle {
            top: 22px;
            right: 24px;
            width: 40px;
            height: 40px;
            }

            .theme-toggle:hover {
            background: rgb(73, 73, 73, 0.5);
            transform: rotate(30deg);
            }
            
            .number-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>
    
    <div class="container">
        <h1><i class="fas fa-clock tomato-icon"></i> Pomodoro Timer</h1>
        
        <div class="mode-indicator">
            <button class="mode-btn active" id="workModeBtn">Trabajo</button>
            <button class="mode-btn" id="breakModeBtn">Descanso</button>
        </div>
        
        <div class="progress-ring">
            <svg width="200" height="200">
                <circle cx="100" cy="100" r="90" stroke="#f0f0f0" stroke-width="10" fill="transparent" class="dark-mode-circle"></circle>
                <circle cx="100" cy="100" r="90" stroke="#f44336" stroke-width="10" fill="transparent" 
                        stroke-dasharray="565.48" stroke-dashoffset="0" id="progressCircle"
                        class="progress-ring-circle"></circle>
            </svg>
            <div class="timer-display" id="timerDisplay">25:00</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="startBtn">
                <i class="fas fa-play"></i> Iniciar
            </button>
            <button class="btn btn-secondary" id="pauseBtn" disabled>
                <i class="fas fa-pause"></i> Pausar
            </button>
            <button class="btn btn-danger" id="resetBtn">
                <i class="fas fa-redo"></i> Reiniciar
            </button>
        </div>
        
        <div class="settings">
            <div class="setting-row">
                <label for="workTime"><i class="fas fa-briefcase"></i> Tiempo de trabajo (min):</label>
                <input type="number" id="workTime" class="number-input" value="25" min="1" max="60">
            </div>
            <div class="setting-row">
                <label for="breakTime"><i class="fas fa-coffee"></i> Tiempo de descanso (min):</label>
                <input type="number" id="breakTime" class="number-input" value="5" min="1" max="30">
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="pomodoroCount">0</div>
                <div class="stat-label">Pomodoros</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalWorkTime">0</div>
                <div class="stat-label">Minutos trabajados</div>
            </div>
        </div>
    </div>

    <script>
        // Variables globales
        let workTime = 25 * 60; // 25 minutos en segundos
        let breakTime = 5 * 60; // 5 minutos en segundos
        let timeLeft = workTime;
        let timerId = null;
        let isRunning = false;
        let isWorkMode = true;
        let pomodoros = 0;
        let totalWorkTime = 0; // en minutos
        let isDarkMode = false;
        let totalTime = workTime;
        let progressCircle = document.getElementById('progressCircle');
        let circumference = 2 * Math.PI * 90; // radio del círculo

        // Elementos DOM
        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const workModeBtn = document.getElementById('workModeBtn');
        const breakModeBtn = document.getElementById('breakModeBtn');
        const pomodoroCount = document.getElementById('pomodoroCount');
        const totalWorkTimeDisplay = document.getElementById('totalWorkTime');
        const workTimeInput = document.getElementById('workTime');
        const breakTimeInput = document.getElementById('breakTime');
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        // Inicializar progress circle
        progressCircle.style.strokeDasharray = circumference;
        progressCircle.style.strokeDashoffset = circumference;

        // Función para actualizar el display del temporizador
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Actualizar progreso del círculo
            const progress = ((totalTime - timeLeft) / totalTime) * circumference;
            progressCircle.style.strokeDashoffset = circumference - progress;
            
            // Cambiar color según modo
            progressCircle.style.stroke = isWorkMode ? '#f44336' : '#4CAF50';
        }

        // Función para iniciar el temporizador
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            
            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    playAlarm();
                    
                    if (isWorkMode) {
                        pomodoros++;
                        totalWorkTime += parseInt(workTimeInput.value);
                        pomodoroCount.textContent = pomodoros;
                        totalWorkTimeDisplay.textContent = totalWorkTime;
                        
                        showNotification('¡Tiempo de trabajo completado!', 'Toma un descanso.', isWorkMode);
                        switchMode('break');
                    } else {
                        showNotification('¡Descanso terminado!', 'Volvamos al trabajo.', isWorkMode);
                        switchMode('work');
                    }
                    
                    resetTimer();
                    startTimer();
                }
            }, 1000);
        }

        // Función para pausar el temporizador
        function pauseTimer() {
            clearInterval(timerId);
            isRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }

        // Función para reiniciar el temporizador
        function resetTimer() {
            pauseTimer();
            timeLeft = isWorkMode ? workTime : breakTime;
            totalTime = timeLeft;
            updateDisplay();
        }

        // Función para cambiar entre modos
        function switchMode(mode) {
            isWorkMode = mode === 'work';
            
            // Actualizar botones de modo
            workModeBtn.classList.toggle('active', isWorkMode);
            workModeBtn.classList.toggle('break-mode', !isWorkMode);
            breakModeBtn.classList.toggle('active', !isWorkMode);
            breakModeBtn.classList.toggle('break-mode', !isWorkMode);
            
            // Actualizar tiempos
            workTime = parseInt(workTimeInput.value) * 60;
            breakTime = parseInt(breakTimeInput.value) * 60;
            timeLeft = isWorkMode ? workTime : breakTime;
            totalTime = timeLeft;
            updateDisplay();
        }

        // Función para reproducir sonido de alarma
        function playAlarm() {
            // Crear sonido usando el Web Audio API
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 1);
        }

        // Función para mostrar notificación
        function showNotification(title, message, isWork) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, {
                    body: message,
                    icon: isWork ? 'https://cdn-icons-png.flaticon.com/512/808/808439.png' : 'https://cdn-icons-png.flaticon.com/512/3079/3079165.png'
                });
            } else {
                // Notificación de respaldo si no hay permisos
                alert(`${title}\n${message}`);
            }
        }

        // Función para cambiar tema claro/oscuro
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            body.classList.toggle('dark-mode', isDarkMode);
            
            // Actualizar icono del botón
            const icon = themeToggle.querySelector('i');
            icon.classList.toggle('fa-moon', !isDarkMode);
            icon.classList.toggle('fa-sun', isDarkMode);
            
            // Guardar preferencia en localStorage
            localStorage.setItem('pomodoroDarkMode', isDarkMode);
        }

        // Solicitar permisos para notificaciones
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }
        }

        // Cargar datos guardados
        function loadSavedData() {
            // Cargar tema
            const savedTheme = localStorage.getItem('pomodoroDarkMode');
            if (savedTheme === 'true') {
                toggleTheme();
            }
            
            // Cargar contadores
            const savedPomodoros = localStorage.getItem('pomodoroCount');
            const savedWorkTime = localStorage.getItem('totalWorkTime');
            
            if (savedPomodoros) {
                pomodoros = parseInt(savedPomodoros);
                pomodoroCount.textContent = pomodoros;
            }
            
            if (savedWorkTime) {
                totalWorkTime = parseInt(savedWorkTime);
                totalWorkTimeDisplay.textContent = totalWorkTime;
            }
        }

        // Guardar datos
        function saveData() {
            localStorage.setItem('pomodoroCount', pomodoros);
            localStorage.setItem('totalWorkTime', totalWorkTime);
        }

        // Event Listeners
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        workModeBtn.addEventListener('click', () => {
            if (!isRunning) switchMode('work');
        });

        breakModeBtn.addEventListener('click', () => {
            if (!isRunning) switchMode('break');
        });

        workTimeInput.addEventListener('change', () => {
            const value = parseInt(workTimeInput.value);
            if (value < 1) workTimeInput.value = 1;
            if (value > 60) workTimeInput.value = 60;
            
            if (isWorkMode && !isRunning) {
                workTime = parseInt(workTimeInput.value) * 60;
                timeLeft = workTime;
                totalTime = timeLeft;
                updateDisplay();
            }
        });

        breakTimeInput.addEventListener('change', () => {
            const value = parseInt(breakTimeInput.value);
            if (value < 1) breakTimeInput.value = 1;
            if (value > 30) breakTimeInput.value = 30;
            
            if (!isWorkMode && !isRunning) {
                breakTime = parseInt(breakTimeInput.value) * 60;
                timeLeft = breakTime;
                totalTime = timeLeft;
                updateDisplay();
            }
        });

        themeToggle.addEventListener('click', toggleTheme);

        // Inicializar la aplicación
        function initApp() {
            updateDisplay();
            requestNotificationPermission();
            loadSavedData();
            
            // Guardar datos cuando se cierre la página
            window.addEventListener('beforeunload', saveData);
            
            // También guardar cada minuto por si acaso
            setInterval(saveData, 60000);
        }

        // Iniciar la aplicación cuando se cargue la página
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
